name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so upstream Home Assistant changes are caught when the repo is quiet.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the manifest with hassfest
        uses: home-assistant/actions/hassfest@master
