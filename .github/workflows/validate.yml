name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so upstream Home Assistant / HACS changes are caught even when
  # the repo is quiet (requirements_test.txt is intentionally unpinned).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the manifest with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the repository with the HACS action
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned so a new ruff release can't turn CI red without a deliberate bump.
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Ruff lint
        run: ruff check custom_components tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The pinned Home Assistant test harness requires Python >= 3.13.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run pytest (with coverage, >=95% overall)
        run: python -m pytest -q --cov=custom_components/ski_resort --cov-report=term-missing --cov-fail-under=95
      - name: Enforce 100% config-flow coverage
        run: coverage report --include="*/config_flow.py" --fail-under=100
      # Platinum quality-scale: strict static typing (config in pyproject.toml).
      - name: Type-check with mypy (strict)
        run: mypy
